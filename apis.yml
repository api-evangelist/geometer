description: Geometer is a San Francisco-based business incubator that builds and launches innovative,
  technology-driven companies. It provides founding leadership, physical facilities, guidance, camaraderie,
  and funding to early-stage teams building game-changing products, in San Francisco and around the world.
  Geometer operates as a company studio and accelerator rather than a software vendor; as of this profile
  it publishes no public developer platform, API, SDK, or technical documentation. It was surfaced through
  the Bloomberg Beta portfolio graph and added to the API Evangelist network as a company lead. Contact is
  via contact@geometer.io, and the studio is located at 530 Jackson St, 3F, San Francisco, CA 94133.
